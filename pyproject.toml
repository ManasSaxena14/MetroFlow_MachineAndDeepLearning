[project]
name = "metroflow"
version = "2.0.0"
description = "Leak-free traffic speed forecasting on METR-LA: per-sensor baselines, graph neural networks, a DCRNN + XGBoost hybrid, congestion alerts and a Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Manas Saxena" }, { name = "Harsh Raj" }, { name = "Sumit Yadav" }]

[project.urls]
Repository = "https://github.com/ManasSaxena14/TrafficFlowControl_AIML-DL_T036"
Dashboard = "https://trafficflowamldl.streamlit.app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 135
target-version = "py311"
extend-exclude = ["ref", "notebooks", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip() deliberately truncates to the shorter list (e.g. a fixed colour list)

[tool.ruff.lint.per-file-ignores]
"dashboard/*.py" = ["E501"]   # CSS and copy
